name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agentd
            pkgs: ./tests/agentd
          - name: hello-world
            pkgs: ./tests/hello-world
          - name: inhabitants
            pkgs: ./tests/inhabitants
          - name: unit
            pkgs: ./supervisor ./firecracker-helper ./examples/... ./porter ./tests/echo ./tests/harness ./tests/vendormock
    # x86_64: Firecracker binary and kernel in the strong-wall test are x86_64.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/reference-env

      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm

      - name: Prebuild the Squid image
        # The runner's Azure resolver (168.63.129.16) intermittently fails to
        # resolve archive.ubuntu.com, which breaks the apt step of the Squid
        # build. Build it once with public DNS, then drop the override: with
        # it in place the weak-wall probe times out. EnsureSquid skips the
        # build when the image exists.
        run: |
          echo '{"dns":["8.8.8.8","1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker build -t hermetarium-squid:local supervisor/squid
          sudo rm /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: actions/cache@v6
        with:
          path: .cache
          key: ${{ runner.os }}-fc-${{ matrix.name }}-${{ hashFiles('supervisor/strong.go', 'supervisor/oci.go', 'firecracker-helper/pack-oci.sh', 'examples/**') }}

      - name: Build
        run: make build

      - name: Test
        run: make test TEST_PKGS="${{ matrix.pkgs }}"

      - name: Release binaries are static (glibc baseline)
        if: matrix.name == 'unit'
        run: python3 .github/scripts/release.py --check-build

  test-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HERMETARIUM_ANTHROPIC_API_KEY: ${{ secrets.HERMETARIUM_ANTHROPIC_API_KEY }}
      HERMETARIUM_XAI_API_KEY: ${{ secrets.HERMETARIUM_XAI_API_KEY }}
      HERMETARIUM_DEEPSEEK_API_KEY: ${{ secrets.HERMETARIUM_DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/reference-env
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Prebuild the Squid image
        # The runner's Azure resolver (168.63.129.16) intermittently fails to
        # resolve archive.ubuntu.com, which breaks the apt step of the Squid
        # build. Build it once with public DNS, then drop the override: with
        # it in place the weak-wall probe times out. EnsureSquid skips the
        # build when the image exists.
        run: |
          echo '{"dns":["8.8.8.8","1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker build -t hermetarium-squid:local supervisor/squid
          sudo rm /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Live tests
        run: |
          if [ -z "$HERMETARIUM_ANTHROPIC_API_KEY$HERMETARIUM_XAI_API_KEY$HERMETARIUM_DEEPSEEK_API_KEY" ]; then
            echo "no live keys set; skip"
            exit 0
          fi
          make test-live

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: cachix/install-nix-action@v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/reference-env
      - name: Tag and attach linux-amd64 binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release.py
