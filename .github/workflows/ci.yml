name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # x86_64: Firecracker binary and kernel in the strong-wall test are x86_64.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm

      - uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-fc-${{ hashFiles('supervisor/strong.go', 'firecracker-helper/build-rootfs.sh') }}

      - name: Build
        run: make build

      - name: Test
        run: make test
