name: Question
description: Ask how something works or how to use it.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: The [website](https://pihme.github.io/hermetarium/) and the usage guide may already answer it.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you tried, version, which wall and image you use.
