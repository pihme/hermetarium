# Commit prefixes follow the release rules in AGENTS.md (.github/scripts/release.py):
#   Go modules -> fix(deps): patch release of hermetarium (go.mod is a release path)
#   GitHub Actions -> ci(deps); example/inhabitant base images -> chore(deps): no release,
#   because examples/ and inhabitants/ are not part of any released artifact
version: 2
updates:
  # One Go module (go.mod at the root; porter and examples are packages inside it)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Base images of the example and inhabitant templates
  - package-ecosystem: docker
    directories:
      - /examples/echo
      - /examples/agentd
      - /inhabitants/claude-code
      - /inhabitants/grok-build
      - /inhabitants/deepseek-harness
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
