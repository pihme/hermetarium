# Wall for examples/echo: inbound plus probe origin on the gate.
http_port 127.0.0.1:3129
http_port 0.0.0.0:80 accel defaultsite=probe.hermetarium.test vhost
http_port 0.0.0.0:18081 accel defaultsite=echo.hermetarium.test vhost
http_port 0.0.0.0:3128 intercept
visible_hostname hermetarium
pid_filename /log/squid.pid
coredump_dir /tmp
cache_log /log/cache.log
logformat htm %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %>lp
access_log stdio:/log/access.log htm
logfile_rotate 0
shutdown_lifetime 1 seconds
connect_timeout 2 seconds
cache_effective_user proxy
dns_v4_first on
cache deny all

acl probe dstdomain probe.hermetarium.test
acl probe_dst dst 172.16.0.1
acl probe_dst dst 127.0.0.1
acl inbound myport 18081
cache_peer 127.0.0.1 parent 18080 0 no-query no-digest originserver name=probeorigin
cache_peer inhabitant parent 8080 0 no-query no-digest originserver name=inhabitant
cache_peer_access inhabitant allow inbound
cache_peer_access inhabitant deny all
cache_peer_access probeorigin deny inbound
cache_peer_access probeorigin allow all
always_direct deny all
never_direct allow all
http_access allow inbound
http_access allow probe
http_access allow probe_dst
http_access deny all
