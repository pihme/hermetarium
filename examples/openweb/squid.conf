# Open web. Decrypt HTTPS, except hosts on the passthrough list.
# api.github.com gets the gate token. Replace __GITHUB_TOKEN__ before create.
# The token stays in this file.

http_port 127.0.0.1:3129
http_port 0.0.0.0:3128 intercept name=intercept
https_port 0.0.0.0:3130 intercept name=tlsin ssl-bump cert=/log/mitm/ca.pem key=/log/mitm/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /log/mitm/ssl_db -M 4MB
sslcrtd_children 8 startup=1 idle=1

visible_hostname hermetarium
pid_filename /log/squid.pid
coredump_dir /tmp
cache_log /log/cache.log
# Bump mode and SNI follow the local port. hermetarium logs reads them there.
logformat htm %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %>lp %ssl::bump_mode %ssl::>sni %err_code %err_detail
access_log stdio:/log/access.log htm
logfile_rotate 0
shutdown_lifetime 1 seconds
connect_timeout 2 seconds
cache_effective_user proxy
cache deny all

# SNI is known only after peek. Pass-through keeps the site certificate.
# Replace pinned.example with hosts that pin a certificate or need HTTP/2.
acl step1 at_step SslBump1
acl passthrough ssl::server_name pinned.example
ssl_bump peek step1
ssl_bump splice passthrough
ssl_bump bump all

acl tlsin myportname tlsin
acl githubhost dstdomain api.github.com

# A bumped request stays on the origin connection Squid already opened.
# That connection is checked against the system CA.
tls_outgoing_options cafile=/etc/ssl/certs/ca-certificates.crt

always_direct allow tlsin
never_direct deny tlsin

# The box token is dropped only for api.github.com, then replaced from this file.
request_header_access Authorization deny githubhost
request_header_add Authorization "Bearer __GITHUB_TOKEN__" githubhost

acl gh_read method GET HEAD
acl gh_post method POST
acl gh_encoded urlpath_regex \.\. %
acl gh_repo urlpath_regex ^/user/repos$
acl gh_orgrepo urlpath_regex ^/orgs/[^/]+/repos$
acl gh_pr urlpath_regex ^/repos/[^/]+/[^/]+/pulls$
acl gh_issue urlpath_regex ^/repos/[^/]+/[^/]+/issues$
acl gh_issue_comment urlpath_regex ^/repos/[^/]+/[^/]+/issues/[^/]+/comments$
acl gh_pr_comment urlpath_regex ^/repos/[^/]+/[^/]+/pulls/[^/]+/comments$

# Port 80 still matches githubhost, and would send the token.
http_access deny githubhost !tlsin
# .. or % can satisfy a write rule and still name another path.
http_access deny githubhost gh_post gh_encoded
http_access allow githubhost gh_read
http_access allow githubhost gh_post gh_repo
http_access allow githubhost gh_post gh_orgrepo
http_access allow githubhost gh_post gh_pr
http_access allow githubhost gh_post gh_issue
http_access allow githubhost gh_post gh_issue_comment
http_access allow githubhost gh_post gh_pr_comment
http_access deny githubhost
http_access allow tlsin
http_access deny all
