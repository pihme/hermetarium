# OpenAI-compatible model. The box calls http://model.hermetarium.test/v1/...
# Set the peer, the Host value, the path prefix, and the key. The key stays here.
# A real upstream uses ssl and tls-cafile on the peer, the same way the vendor peers do.

http_port 127.0.0.1:3129
http_port 0.0.0.0:3128 intercept name=intercept

visible_hostname hermetarium
pid_filename /log/squid.pid
coredump_dir /tmp
cache_log /log/cache.log
logformat htm %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %>lp
access_log stdio:/log/access.log htm
logfile_rotate 0
shutdown_lifetime 1 seconds
connect_timeout 2 seconds
cache_effective_user proxy
cache deny all

acl modelhost dstdomain model.hermetarium.test

cache_peer __MODEL_PEER__
cache_peer_access model allow modelhost
cache_peer_access model deny all

# Prefix includes the leading slash. Empty leaves the box's path unchanged.
url_rewrite_program /log/model-rewrite __MODEL_PREFIX__
url_rewrite_children 8 startup=1 idle=1
url_rewrite_access allow modelhost
url_rewrite_access deny all

request_header_access Host deny modelhost
request_header_add Host "__MODEL_HOST__" modelhost
request_header_access Authorization deny modelhost
request_header_add Authorization "Bearer __MODEL_KEY__" modelhost

always_direct deny all
never_direct allow all

http_access allow modelhost
http_access deny all
