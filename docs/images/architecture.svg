<svg viewBox="-10 -10 940 390" width="940" height="390" role="img" aria-label="Hermetarium architecture: the supervisor starts a Squid gate and the wall; operator HTTP and all inhabitant egress pass through Squid, which logs to the instance directory and injects vendor keys per ACL." xmlns="http://www.w3.org/2000/svg"><title>Hermetarium architecture: the supervisor starts a Squid gate and the wall; operator HTTP and all inhabitant egress pass through Squid, which logs to the instance directory and injects vendor keys per ACL.</title><style>svg{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.bg{fill:#f7f6f3}.dx-box{fill:#fff;stroke:#1f6f5c;stroke-opacity:.8}.dx-box.s{fill:#1f6f5c;stroke:#1f6f5c}.dx-t{fill:#1c1c1e;font-size:15px;font-weight:600}.dx-s{fill:#66666e;font-size:12px}.dx-on{fill:#fff}.dx-sub-on{fill:#fff;opacity:.85;font-size:12px}.dx-reg{fill:none;stroke:#1f6f5c;stroke-dasharray:6 6;stroke-opacity:.9}.dx-rl{fill:#1f6f5c;font-size:13px;font-weight:600}.dx-a{stroke:#1f6f5c;stroke-width:2;fill:none}.dx-a.d{stroke-dasharray:5 5}.dx-m{fill:#1f6f5c}.dx-l{fill:#66666e;font-size:12px}</style><rect class="bg" x="-10" y="-10" width="940" height="390" rx="12"/><defs><marker id="ah-hermetarium" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dx-m" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dx-reg" x="560" y="140" width="340" height="130" rx="14"/><text class="dx-rl" x="880" y="258" text-anchor="end">Wall: runc container or Firecracker VM</text><rect class="dx-box" x="20" y="40" width="160" height="56" rx="10"/><text class="dx-t" x="100.0" y="61.0" text-anchor="middle" dominant-baseline="middle">Operator</text><text class="dx-s" x="100.0" y="80.0" text-anchor="middle" dominant-baseline="middle">curl · browser</text><rect class="dx-box s" x="250" y="40" width="200" height="56" rx="10"/><text class="dx-t dx-on" x="350.0" y="61.0" text-anchor="middle" dominant-baseline="middle">Supervisor</text><text class="dx-sub-on" x="350.0" y="80.0" text-anchor="middle" dominant-baseline="middle">hermetarium · os/exec</text><rect class="dx-box" x="250" y="180" width="210" height="64" rx="10"/><text class="dx-t" x="355.0" y="205.0" text-anchor="middle" dominant-baseline="middle">Squid (gate)</text><text class="dx-s" x="355.0" y="224.0" text-anchor="middle" dominant-baseline="middle">:18081 inbound · :3128 intercept</text><rect class="dx-box" x="600" y="170" width="270" height="64" rx="10"/><text class="dx-t" x="735.0" y="195.0" text-anchor="middle" dominant-baseline="middle">Inhabitant</text><text class="dx-s" x="735.0" y="214.0" text-anchor="middle" dominant-baseline="middle">your OCI image · listens :8080</text><rect class="dx-box" x="250" y="295" width="210" height="56" rx="10"/><text class="dx-t" x="355.0" y="316.0" text-anchor="middle" dominant-baseline="middle">var/&lt;id&gt;/access.log</text><text class="dx-s" x="355.0" y="335.0" text-anchor="middle" dominant-baseline="middle">→ io.jsonl via hermetarium logs</text><rect class="dx-box" x="620" y="305" width="270" height="50" rx="10"/><text class="dx-t" x="755.0" y="323.0" text-anchor="middle" dominant-baseline="middle">Vendor API (HTTPS)</text><text class="dx-s" x="755.0" y="342.0" text-anchor="middle" dominant-baseline="middle">only if allowlisted in --acl</text><line class="dx-a" x1="180" y1="68" x2="248" y2="68" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="214" y="60" text-anchor="middle">create</text><line class="dx-a" x1="100" y1="96" x2="248" y2="200" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="110" y="178" text-anchor="start">HTTP to url</text><line class="dx-a" x1="350" y1="96" x2="350" y2="178" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="358" y="146" text-anchor="start">starts</text><line class="dx-a" x1="450" y1="72" x2="650" y2="138" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="560" y="92" text-anchor="start">starts</text><line class="dx-a" x1="460" y1="200" x2="598" y2="200" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="529" y="192" text-anchor="middle">reverse proxy</text><line class="dx-a d" x1="598" y1="226" x2="462" y2="226" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="529" y="244" text-anchor="middle">egress</text><line class="dx-a" x1="355" y1="244" x2="355" y2="293" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="363" y="274" text-anchor="start">writes</text><line class="dx-a" x1="460" y1="238" x2="618" y2="318" marker-end="url(#ah-hermetarium)"/><text class="dx-l" x="548" y="308" text-anchor="end">key injected</text></svg>
