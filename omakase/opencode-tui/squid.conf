# OpenCode on the strong wall, through the terminal. No inbound port.
# Fill __MODEL_PEER__, __MODEL_HOST__, __MODEL_PREFIX__, __MODEL_KEY__,
# __GITHUB_TOKEN__, and __GITHUB_GIT_BASIC__ before create.
# The box calls http://model.hermetarium.test/v1. Both secrets stay in this file.
# __MODEL_PEER__ is the rest of the cache_peer line, including name=model.
# api.openai.com parent 443 0 no-query no-digest originserver tls tls-cafile=/etc/ssl/certs/ca-certificates.crt name=model
# __GITHUB_GIT_BASIC__ is base64 of x-access-token: followed by the same token.
# Git goes to github.com. gh goes to api.github.com. This file has no Push Guard.

http_port 127.0.0.1:3129
http_port 0.0.0.0:3128 intercept name=intercept
https_port 0.0.0.0:3130 intercept name=tlsin ssl-bump cert=/log/mitm/ca.pem key=/log/mitm/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /log/mitm/ssl_db -M 4MB
sslcrtd_children 8 startup=1 idle=1

visible_hostname hermetarium
pid_filename /log/squid.pid
coredump_dir /tmp
cache_log /log/cache.log
# Bump mode, SNI, and the refusal reason (error code, detail) follow the local port.
# hermetarium logs reads them there.
logformat htm %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %>lp %ssl::bump_mode %ssl::>sni %err_code %err_detail
access_log stdio:/log/access.log htm
logfile_rotate 0
shutdown_lifetime 1 seconds
connect_timeout 2 seconds
cache_effective_user proxy
cache deny all

# SNI is known only after peek. Pass-through keeps the site certificate.
# Replace pinned.example with hosts that pin a certificate or need HTTP/2.
# Each name matches only itself. Several acl passthrough lines add up.
acl step1 at_step SslBump1
acl passthrough ssl::server_name pinned.example
# Package registries keep their own certificate, so a tool that ignores the
# gate CA still installs. Their paths are not in the log.
# Docker Hub: registry, token service, and the layer CDN. dockerd in the box
# pulls with the registry's own certificate. Built images get no gate CA.
# cloudflare is kept in case Docker switches CDN.
acl passthrough ssl::server_name registry-1.docker.io auth.docker.io production.cloudfront.docker.com production.cloudflare.docker.com
acl passthrough ssl::server_name registry.npmjs.org
acl passthrough ssl::server_name repo.maven.apache.org repo1.maven.org
acl passthrough ssl::server_name crates.io static.crates.io index.crates.io
acl passthrough ssl::server_name pypi.org files.pythonhosted.org
# The image is Debian bookworm.
acl passthrough ssl::server_name deb.debian.org security.debian.org
ssl_bump peek step1
ssl_bump splice passthrough
ssl_bump bump all

acl tlsin myportname tlsin
acl modelhost dstdomain model.hermetarium.test
acl githubhost dstdomain api.github.com
acl githost dstdomain github.com

cache_peer __MODEL_PEER__
cache_peer_access model allow modelhost
cache_peer_access model deny all

# Prefix includes the leading slash. Delete __MODEL_PREFIX__ to leave the box path unchanged.
url_rewrite_program /log/model-rewrite __MODEL_PREFIX__
url_rewrite_children 8 startup=1 idle=1
url_rewrite_access allow modelhost
url_rewrite_access deny all

request_header_access Host deny modelhost
request_header_add Host "__MODEL_HOST__" modelhost

# The box token is dropped only for these hosts, then replaced from this file.
request_header_access Authorization deny modelhost
request_header_access Authorization deny githubhost
request_header_access Authorization deny githost
request_header_add Authorization "Bearer __MODEL_KEY__" modelhost
request_header_add Authorization "Bearer __GITHUB_TOKEN__" githubhost
request_header_add Authorization "Basic __GITHUB_GIT_BASIC__" githost
request_header_access x-api-key deny all

# A bumped request stays on the origin connection Squid already opened.
# That connection is checked against the system CA.
tls_outgoing_options cafile=/etc/ssl/certs/ca-certificates.crt

# The model is a peer. Other HTTPS is direct, on the connection already opened.
# Plain HTTP has no peer either. Cleartext GitHub is still denied below.
always_direct deny modelhost
always_direct allow tlsin
always_direct allow !modelhost
never_direct allow modelhost
never_direct deny tlsin
never_direct deny !modelhost

# Traversal in the path is denied. The query string is not part of that
# check, so a gh search or branch=feature%2Fx still passes. %2F in a path
# is a branch name, not traversal.
acl gh_traverse urlpath_regex -i ^[^?]*\.\. ^[^?]*%2e%2e ^[^?]*%2e\. ^[^?]*\.%2e

# Port 80 still matches these hosts, and would send the token.
http_access deny githubhost !tlsin
http_access deny githost !tlsin
http_access deny githubhost gh_traverse
http_access deny githost gh_traverse
http_access allow githubhost
http_access allow githost
http_access allow modelhost
http_access allow tlsin
# Plain HTTP downloads. Cleartext GitHub stays denied above, so the token is not sent on port 80.
http_access allow !githubhost !githost
http_access deny all
# A denied request is answered 403 with the reason, not the allowlist.
deny_info ERR_HTM_NOT_ALLOWLISTED all tlsin gh_traverse
