# Wall for inhabitants/claude-code. Replace __VENDOR_KEY__ before create.
# Squid: https://www.squid-cache.org/
# Settings in this file: https://www.squid-cache.org/Versions/v6/cfgman/

http_port 127.0.0.1:3129
http_port 0.0.0.0:18081 accel defaultsite=inhabitant vhost
http_port 0.0.0.0:3128 intercept

visible_hostname hermetarium
pid_filename /log/squid.pid
coredump_dir /tmp
cache_log /log/cache.log
logformat htm %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %>lp
access_log stdio:/log/access.log htm
logfile_rotate 0
shutdown_lifetime 1 seconds
connect_timeout 2 seconds
cache_effective_user proxy
dns_v4_first on
cache deny all

acl inbound myport 18081
acl vendorhost dstdomain claude.hermetarium.test

cache_peer inhabitant parent 8080 0 no-query no-digest originserver name=inhabitant
cache_peer_access inhabitant allow inbound
cache_peer_access inhabitant deny all

cache_peer api.anthropic.com parent 443 0 no-query no-digest originserver ssl sslflags=DONT_VERIFY_PEER name=vendor
cache_peer_access vendor allow vendorhost
cache_peer_access vendor deny all

request_header_access x-api-key deny all
request_header_access Authorization deny all
request_header_add x-api-key "__VENDOR_KEY__" vendorhost
request_header_add Authorization "Bearer __VENDOR_KEY__" vendorhost

# OPEN-IN. Remove the # from these lines, and comment out the two OPEN-OUT lines.
