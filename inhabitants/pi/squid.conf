# Wall for inhabitants/pi. Fill __MODEL_PEER__, __MODEL_HOST__, __MODEL_PREFIX__, __MODEL_KEY__, __GITHUB_TOKEN__, and __GITHUB_GIT_BASIC__ before create.
# The box calls http://model.hermetarium.test/v1. Both secrets stay in this file.
# __MODEL_PEER__ is the rest of the cache_peer line. The cache_peer_access lines refer to name=model.
# api.openai.com parent 443 0 no-query no-digest originserver tls tls-cafile=/etc/ssl/certs/ca-certificates.crt name=model
# __GITHUB_GIT_BASIC__ is base64 of x-access-token: followed by the same token.
# Git goes to github.com. gh goes to api.github.com. This file has no Push Guard.
# Squid: https://www.squid-cache.org/
# Settings in this file: https://www.squid-cache.org/Versions/v6/cfgman/

http_port 127.0.0.1:3129
http_port 0.0.0.0:18081 accel defaultsite=inhabitant vhost name=inbound
http_port 0.0.0.0:3128 intercept name=intercept

visible_hostname hermetarium
pid_filename /log/squid.pid
coredump_dir /tmp
cache_log /log/cache.log
logformat htm %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %>lp
access_log stdio:/log/access.log htm
logfile_rotate 0
shutdown_lifetime 1 seconds
connect_timeout 2 seconds
cache_effective_user proxy
cache deny all

acl inbound myportname inbound
acl modelhost dstdomain model.hermetarium.test
acl githubhost dstdomain api.github.com
acl githost dstdomain github.com

cache_peer inhabitant parent 8080 0 no-query no-digest originserver name=inhabitant
cache_peer_access inhabitant allow inbound
cache_peer_access inhabitant deny all

cache_peer __MODEL_PEER__
cache_peer_access model deny inbound
cache_peer_access model allow modelhost
cache_peer_access model deny all

# Prefix includes the leading slash. Delete __MODEL_PREFIX__ to leave the box path unchanged.
url_rewrite_program /log/model-rewrite __MODEL_PREFIX__
url_rewrite_children 8 startup=1 idle=1
url_rewrite_access allow modelhost
url_rewrite_access deny all

request_header_access Host deny modelhost
request_header_add Host "__MODEL_HOST__" modelhost

request_header_access x-api-key deny all
request_header_access Authorization deny modelhost
request_header_access Authorization deny githubhost
request_header_access Authorization deny githost
request_header_add Authorization "Bearer __MODEL_KEY__" modelhost !inbound
request_header_add Authorization "Bearer __GITHUB_TOKEN__" githubhost
request_header_add Authorization "Basic __GITHUB_GIT_BASIC__" githost

# OPEN-IN. Remove the # from these lines, and comment out the two OPEN-OUT lines.
#acl container_out myportname intercept
#always_direct allow container_out !modelhost
#never_direct deny container_out !modelhost
#never_direct allow modelhost
#never_direct allow inbound
#http_access allow container_out

# OPEN-HTTPS. Remove the # from these lines, and comment out the two OPEN-OUT lines.
# Squid decrypts the container's HTTPS. The log records the site and the path.
#https_port 0.0.0.0:3130 intercept name=tlsin ssl-bump cert=/log/mitm/ca.pem key=/log/mitm/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
#sslcrtd_program /usr/lib/squid/security_file_certgen -s /log/mitm/ssl_db -M 4MB
#sslcrtd_children 8 startup=1 idle=1
#acl container_tls myportname tlsin
#acl step1 at_step SslBump1
#ssl_bump peek step1
#ssl_bump bump all
#always_direct allow container_tls
#never_direct deny container_tls
#never_direct allow modelhost
#never_direct allow inbound
#http_access allow container_tls

# OPEN-OUT. Comment these two lines out when the OPEN-IN or OPEN-HTTPS lines above are on.
always_direct deny all
never_direct allow all

# The inbound port is published to the host. It never reaches the model and never carries the key.
http_access deny inbound modelhost
http_access allow inbound
http_access allow githubhost
http_access allow githost
http_access allow modelhost
http_access deny all
